<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1423"><title>Board Unit Disiplin | SMadJiwa</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#0b1423;--panel:#122239;--panel2:#0e1b2d;--line:#2b405b;--text:#eef5ff;--muted:#9bb0ca;--blue:#4e91f7;--green:#23c995;--amber:#f3b94f;--red:#fa7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#193858,#0b1423 44%);color:var(--text);font:14px 'Plus Jakarta Sans',sans-serif}header{background:#0d192a;border-bottom:1px solid var(--line);padding:15px 18px}.head,main{max-width:1180px;margin:auto}.head{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}.brand{flex:1}.eyebrow,.smallcap{font-size:10px;letter-spacing:1px;color:#72c7ef;font-weight:800}.brand h1{font-size:17px;margin:3px 0}.brand p{font-size:10px;color:var(--muted);margin:0}main{padding:22px 14px 45px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h2{margin:0 0 5px;font-size:23px}.top p{margin:0;color:var(--muted);font-size:12px}.btn{border:1px solid #45617f;background:#1b3451;color:white;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:18px 0}.stat{border:1px solid var(--line);border-radius:13px;padding:14px;background:linear-gradient(145deg,#14243a,#101c2e)}.stat span{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.6px}.stat b{font-size:27px;display:block;margin-top:5px}.stat:nth-child(2) b{color:var(--amber)}.stat:nth-child(3) b{color:#78c9f4}.stat:nth-child(4) b{color:var(--green)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.toolbar input,.toolbar select,.edit select{background:#0b1728;border:1px solid #304660;color:white;border-radius:9px;padding:11px;font:inherit}.toolbar input{flex:1;min-width:220px}.toolbar select{min-width:160px}.list{display:grid;gap:11px}.case{background:linear-gradient(145deg,#14243a,#101c2e);border:1px solid var(--line);border-radius:14px;padding:15px}.casehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.case h3{margin:0 0 4px;font-size:15px}.meta{color:var(--muted);font-size:11px;line-height:1.7}.pill{display:inline-block;border-radius:30px;padding:5px 9px;font-size:10px;font-weight:800;white-space:nowrap;background:#263a54;color:#d5e7ff}.pill.warn{background:#4a3719;color:#f8d58b}.pill.info{background:#173b50;color:#a8e0fa}.pill.done{background:#174332;color:#a8f0cb}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:13px 0}.detail{background:#0c192a;border:1px solid #243b55;border-radius:9px;padding:9px}.detail span{display:block;color:var(--muted);font-size:9px;font-weight:800;margin-bottom:4px}.detail b{font-size:11px;line-height:1.5;overflow-wrap:anywhere}.desc{font-size:12px;line-height:1.6;color:#d8e5f5;white-space:pre-wrap;margin:8px 0}.edit{border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:end;gap:9px;flex-wrap:wrap}.edit label{display:block;color:var(--muted);font-size:10px;font-weight:800;margin:0 0 5px}.edit select{min-width:170px}.edit .save{background:#246bd0;border:0}.notice{padding:11px;border-radius:9px;margin:12px 0;font-size:12px;display:none}.ok{display:block;background:#10372f;color:#bbf7d0}.err{display:block;background:#481f2b;color:#fecdd3}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #3b526e;border-radius:12px}.studentrow{display:flex;gap:14px;align-items:flex-start}.studentphoto{display:block;width:auto;height:auto;max-width:148px;max-height:240px;flex:0 0 auto;object-fit:contain;object-position:top center;align-self:flex-start;border-radius:10px;border:1px solid #304660;background:#0b1728}.casecontent{flex:1;min-width:0}.hidden{display:none!important}a{color:#8ec5ff}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.details{grid-template-columns:repeat(2,1fr)}.top h2{font-size:20px}.edit{display:grid;grid-template-columns:1fr}.edit select,.edit button{width:100%}}@media(max-width:420px){.details{grid-template-columns:1fr}.casehead{display:block}.casehead .pill{margin-top:8px}.studentrow{gap:9px}.studentphoto{max-width:112px;max-height:190px}}
</style></head><body><header><div class="head"><img class="logo" src="https://mylink.la/storage/avatars/a7/51148-a7263e64de7d87e7.png"><div class="brand"><div class="eyebrow">PENGURUSAN KES HEM</div><h1>Board Unit Disiplin</h1><p>Sekolah Menengah Sains Sultan Mohamad Jiwa · Kedah</p></div><button class="btn" onclick="loadBoard()">↻ Segerak</button></div></header><main><div class="top"><div><h2>Pengurusan Kes Disiplin</h2><p>Laporan daripada guru akan ditarik secara automatik daripada tab MuridMasalah.</p></div><div class="smallcap" id="updated">BELUM DISEGERAKKAN</div></div><div class="stats"><div class="stat"><span>JUMLAH KES</span><b id="total">—</b></div><div class="stat"><span>BAHARU</span><b id="new">—</b></div><div class="stat"><span>DALAM SIASATAN</span><b id="invest">—</b></div><div class="stat"><span>SELESAI</span><b id="done">—</b></div></div><div id="notice" class="notice"></div><div class="toolbar"><input id="search" placeholder="Cari nama murid, kelas, kategori atau ID kes..." oninput="render()"><select id="filter" onchange="render()"><option value="Semua">Semua kes belum selesai</option><option value="Baharu">Baharu</option><option value="Dalam Siasatan">Dalam Siasatan</option><option value="Tamat">Tamat (kes selesai)</option></select></div><div id="list" class="list"><div class="empty">Sedang memuatkan rekod kes...</div></div></main>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbzuufP2Vntuuq4y9k-PcunlBwyhpTLIG5E5GmAE2skwhhY-h6LrhHF7qIFrj681xwdV3w/exec';let records=[];
function api(params,done){const cb='cb'+Date.now()+Math.floor(Math.random()*9999),s=document.createElement('script');let ended=false;const t=setTimeout(()=>finish({success:false,error:'Sambungan GAS tamat masa.'}),20000);function finish(v){if(ended)return;ended=true;clearTimeout(t);delete window[cb];s.remove();done(v)}window[cb]=finish;s.onerror=()=>finish({success:false,error:'Gagal menghubungi GAS.'});s.src=GAS_URL+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.head.append(s)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function msg(t,ok){const n=document.getElementById('notice');n.className='notice '+(ok?'ok':'err');n.textContent=t}
function loadBoard(){document.getElementById('list').innerHTML='<div class="empty">Sedang menyegerakkan rekod kes...</div>';api({action:'getDisciplineBoard'},r=>{if(!r.success){msg(r.error||'Gagal memuatkan board.',false);document.getElementById('list').innerHTML='<div class="empty">Rekod tidak dapat dimuatkan.</div>';return}records=r.items||[];document.getElementById('total').textContent=r.stats.total;document.getElementById('new').textContent=r.stats.baharu;document.getElementById('invest').textContent=r.stats.siasatan;document.getElementById('done').textContent=r.stats.selesai;document.getElementById('updated').textContent='KEMAS KINI: '+new Date().toLocaleString('ms-MY');document.getElementById('notice').className='notice';render()})}
function render(){
 const q=document.getElementById('search').value.toLowerCase().trim(),f=document.getElementById('filter').value;
 const filtered=records.filter(x=>{
  const isDone=String(x.STATUS_KES||'').toLowerCase()==='selesai';
  const status=x.STATUS_SIASATAN||'Baharu';
  const hay=[x.ID_LAPORAN,x.NAMA_MURID,x.KELAS,x.KATEGORI_KES,x.NO_KP_MURID].join(' ').toLowerCase();
  const matchSearch=!q||hay.includes(q);
  if(!matchSearch)return false;
  if(f==='Tamat')return isDone||status==='Tamat';
  if(isDone)return false;
  return f==='Semua'||status===f;
 });
 const el=document.getElementById('list');
 if(!filtered.length){el.innerHTML=`<div class="empty">${f==='Tamat'?'Tiada rekod kes tamat.':'Tiada kes belum selesai untuk paparan ini.'}</div>`;return}
 el.innerHTML=filtered.map(x=>{
  const isDone=String(x.STATUS_KES||'').toLowerCase()==='selesai';
  const st=x.STATUS_SIASATAN||'Baharu';
  const pill=isDone||st==='Tamat'?'done':(st==='Dalam Siasatan'?'info':'warn');
  const statusKes=isDone?'Selesai':'Belum Selesai';
  const statusArea=isDone
   ? `<div class="edit"><div class="meta"><b>Status kes:</b> Selesai · <b>Status siasatan:</b> Tamat<br>Tarikh selesai: ${esc(x.TARIKH_SELESAI||'—')}</div></div>`
   : `<div class="edit"><div><label>STATUS SIASATAN</label><select id="si-${esc(x.ID_LAPORAN)}"><option ${st==='Baharu'?'selected':''}>Baharu</option><option ${st==='Dalam Siasatan'?'selected':''}>Dalam Siasatan</option><option ${st==='Tamat'?'selected':''}>Tamat</option></select></div><div><label>STATUS KES</label><select id="sk-${esc(x.ID_LAPORAN)}"><option ${statusKes==='Belum Selesai'?'selected':''}>Belum Selesai</option><option>Selesai</option></select></div><button class="btn save" onclick="saveStatus('${esc(x.ID_LAPORAN)}')">Simpan Status</button><div class="meta">Mula siasatan: ${esc(x.TARIKH_MULA_SIASATAN||'—')} · Selesai: ${esc(x.TARIKH_SELESAI||'—')}</div></div>`;
  const photo=x.GAMBAR_MURID?`<img class="studentphoto" src="${esc(x.GAMBAR_MURID)}" alt="Gambar ${esc(x.NAMA_MURID)}" onerror="this.style.display='none'">`:`<div class="studentphoto" style="width:148px;min-height:148px;display:flex;align-items:center;justify-content:center;color:#7188a5;font-size:11px;text-align:center;padding:8px">Gambar murid tiada</div>`;
  return `<article class="case"><div class="studentrow">${photo}<div class="casecontent"><div class="casehead"><div><h3>${esc(x.NAMA_MURID||'Nama tidak direkodkan')}</h3><div class="meta">${esc(x.ID_LAPORAN)} · ${esc(x.TINGKATAN)} ${esc(x.KELAS)} · KP ${esc(x.NO_KP_MURID)}</div></div><span class="pill ${pill}">${esc((isDone?'TAMAT':st).toUpperCase())}</span></div><div class="details"><div class="detail"><span>KATEGORI KES</span><b>${esc(x.KATEGORI_KES)}</b></div><div class="detail"><span>TARIKH KEJADIAN</span><b>${esc(x.TARIKH_KEJADIAN)}</b></div><div class="detail"><span>PELAPOR</span><b>${esc(x.NAMA_GURU)}</b></div><div class="detail"><span>LOKASI / MASA</span><b>${esc(x.LOKASI_KEJADIAN||'—')} · ${esc(x.MASA_KEJADIAN||'—')}</b></div><div class="detail"><span>KEUTAMAAN</span><b>${esc(x.KEUTAMAAN||'Sederhana')}</b></div><div class="detail"><span>TARIKH LAPORAN</span><b>${esc(x.TARIKH_LAPORAN)}</b></div></div><div class="desc"><b>Butiran kejadian</b><br>${esc(x.BUTIRAN_KES||'Tiada butiran.')}</div>${x.TINDAKAN_GURU?`<div class="desc"><b>Tindakan awal guru</b><br>${esc(x.TINDAKAN_GURU)}</div>`:''}${x.SAKSI?`<div class="meta">Saksi: ${esc(x.SAKSI)}</div>`:''}${x.BUKTI_URL?`<div class="meta">Bukti: <a href="${esc(x.BUKTI_URL)}" target="_blank" rel="noopener">Buka pautan bukti</a></div>`:''}${statusArea}</div></div></article>`;
 }).join('');
}
function saveStatus(id){const sk=document.getElementById('sk-'+id).value;let si=document.getElementById('si-'+id).value;if(sk==='Selesai')si='Tamat';api({action:'updateDisciplineStatus',payload:JSON.stringify({id,statusSiasatan:si,statusKes:sk})},r=>{if(!r.success){msg(r.error||'Gagal menyimpan status.',false);return}msg(r.message||'Status dikemas kini.',true);loadBoard()})}
loadBoard();
</script></body></html>
