px;text-transform:uppercase;padding:12px 13px}td{padding:12px 13px;border-top:1px solid #223148;font-size:10px;color:#d7e2f1}tr:hover td{background:#16243a}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:9px;font-weight:700}.pill.ok{background:#123c36;color:#58d9b5}.pill.warn{background:#46371d;color:#ffd06a}.pill.danger{background:#482630;color:#ff8c98}.pill.info{background:#1c385c;color:#83b5ff}.empty-note{padding:30px;text-align:center;color:var(--muted)}.report-grid{grid-template-columns:repeat(3,1fr)}.report-tile{padding:18px}.report-tile h3{font-size:12px;margin:0 0 7px}.report-tile p{color:var(--muted);font-size:10px;line-height:1.6}.report-tile .btn{margin-top:9px}.subnav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 15px}.subnav button{background:#142238;border:1px solid var(--line);color:#9fb1c9;border-radius:20px;padding:7px 12px;font-size:10px}.subnav button.active{background:#1d4778;color:white;border-color:#3978c2}.notice{padding:12px 14px;border-radius:9px;background:#152944;border:1px solid #29486c;color:#b9d6f6;font-size:10px;margin-bottom:14px}.progress-row{margin:14px 0}.progress-meta{display:flex;justify-content:space-between;font-size:10px;margin-bottom:7px}.progress-meta span:last-child{color:var(--muted)}.progress{height:7px;background:#26364d;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#397ee8,#37c6e8)}.hidden{display:none!important}

<script>

// Integrasi data langsung daripada Web App GAS; reka bentuk asal dikekalkan.
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw0LMXCD7ZwdVY4IVMav8Ix5NQF2ng8wwvHqCAv21_cD9wj6q6sxC6l10yNPHH2DrI21w/exec';
let hemDashboardData = null;

function loadHemData(){
  const note = document.getElementById('hemDataNote');
  if(!GAS_URL.startsWith('https://script.google.com/')){
    if(note) note.textContent = 'Masukkan URL Web App GAS pada pemboleh ubah GAS_URL.';
    return;
  }
  const cb = 'hemCallback_' + Date.now();
  const script = document.createElement('script');
  window[cb] = d => {
    try {
      if(!d || !d.success) throw new Error('Respons API tidak sah.');
      hemDashboardData = d;
      updateHemDashboard(d);
      if(note) note.textContent = d.nota || 'Data berjaya dimuatkan daripada Google Sheets.';
    } catch(e) {
      if(note) note.textContent = 'Ralat data: ' + e.message;
    } finally { delete window[cb]; script.remove(); }
  };
  script.onerror = () => {
    if(note) note.textContent = 'Gagal menghubungi GAS. Semak URL dan deployment.';
    delete window[cb]; script.remove();
  };
  script.src = GAS_URL + (GAS_URL.includes('?') ? '&' : '?') +
    'api=hemDashboard&callback=' + encodeURIComponent(cb) + '&_=' + Date.now();
  document.body.appendChild(script);
}
function updateHemDashboard(d){
  const put = (id,v) => { const e=document.getElementById(id); if(e)e.textContent=v; };
  put('hem-total', fmt(d.jumlahMurid || 0));
  put('hem-gender', `Lelaki ${fmt(d.lelaki || 0)} · Perempuan ${fmt(d.perempuan || 0)}`);
  const k=d.kehadiran || {};
  put('hem-attendance', k.peratus == null ? '—' : k.peratus.toFixed(1)+'%');
  put('hem-attendance-foot', k.adaRekod ? `${fmt(k.hadir||0)} hadir · ${fmt(k.tidakHadir||0)} tidak hadir` : 'Tiada rekod kehadiran hari ini');
  put('hem-sick', fmt(d.muridSakit3K || 0));
  put('hem-date', d.tarikhData || '—');
  put('hem-updated', 'Kemas kini: '+(d.dikemasKini || '—'));
  const c=charts.find(x=>x.canvas && x.canvas.id==='attendanceChart');
  if(c && Array.isArray(d.pecahanTingkatan)){
    c.data.labels=d.pecahanTingkatan.map(x=>x.tingkatan);
    c.data.datasets[0].data=d.pecahanTingkatan.map(x=>x.peratus);
    c.data.datasets[0].backgroundColor=d.pecahanTingkatan.map(x=>x.peratus==null?'#52647d':x.peratus>=95?'#20c997':'#f5b942');
    c.update();
  }
}

const menuNames={dashboard:"Laman Utama",murid:"Profil & Data Murid",kehadiran:"Kehadiran & APDM",disiplin:"Disiplin & SSDM",bantuan:"Kebajikan & Bantuan",kaunseling:"Bimbingan & Kaunseling","3k":"Keselamatan, Kesihatan & Kebersihan (3K)",kantin:"Kantin & Asrama",pibg:"Pemuafakatan PIBG / Sarana",laporan:"Laporan & Analisis"};
const submenus={
murid:["Senarai Induk Murid","Pendaftaran & Pertukaran","Data Keciciran"],
kehadiran:["Rekod Harian","Analisis Bulanan","Ponteng Tegar","Status Penghantaran Kelas"],
disiplin:["Rekod Salah Laku","Rekod Amalan Baik","Kes Berat & Pengawas"],
bantuan:["BAP","KWAMP & Biasiswa","SPBT","RMT & Takaful"],
kaunseling:["Sesi Kaunseling","Ujian Psikometrik","Ziarah Cakna"],
"3k":["Kesihatan & Imunisasi","Denggi","Latihan Kecemasan","Bilik Isolasi"],
kantin:["Laporan Kendiri Kantin","Pemantauan Kualiti","Pengurusan Asrama"],
pibg:["Direktori AJK","Kehadiran Sarana","Kerjasama Agensi Luar"]
};
const students=[
["SM26001","Aiman Hakim bin Azman","1 Amanah","L","Aktif"],["SM26002","Nur Aisyah binti Rahman","1 Bestari","P","Aktif"],["SM25018","Muhammad Danish bin Zulkifli","2 Cekal","L","Aktif"],["SM25031","Siti Nur Balqis binti Ismail","2 Dinamik","P","Aktif"],["SM24009","Adam Firdaus bin Hassan","3 Amanah","L","Aktif"],["SM24042","Nur Izzati binti Omar","3 Bestari","P","Dalam pemantauan"],["SM23015","Harith Iman bin Rosli","4 Cekal","L","Aktif"],["SM23028","Nurul Huda binti Yusof","4 Dinamik","P","Aktif"],["SM22007","Amirul Syafiq bin Karim","5 Amanah","L","Aktif"],["SM22033","Puteri Balqis binti Azmi","5 Bestari","P","Aktif"],["SM26044","Danish Arif bin Saad","1 Cekal","L","Berpindah"],["SM24061","Nur Maisarah binti Ali","3 Dinamik","P","Aktif"]
];
let currentPage="dashboard",currentSub="",charts=[];
const fmt=n=>n.toLocaleString("ms-MY");
function head(title,desc){return `<div class="page-head"><div><div class="eyebrow">Pengurusan Hal Ehwal Murid</div><h1>${title}</h1><p>${desc}</p></div><div class="date-chip">◷ &nbsp; <span id="hem-date">Memuatkan tarikh...</span></div></div>`}
function cardTitle(t,s,tag=""){return `<div class="card-title"><div><h3>${t}</h3><p>${s}</p></div>${tag?`<span class="tag">${tag}</span>`:""}</div>`}
function dashboard(){return `${head("Ringkasan Eksekutif HEM","Pantauan menyeluruh status murid, kebajikan, disiplin dan keselamatan sekolah.")}<div class="notice" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span id="hemDataNote">Menunggu sambungan data Google Sheets...</span><button class="btn secondary" onclick="loadHemData();loadHemSahsiahData()">↻ Kemas kini data</button></div><div class="grid kpis">
${kpi("Jumlah Murid",'<span id="hem-total">—</span>','<span id="hem-gender">Lelaki — · Perempuan —</span>',"♙","blue","Sumber: Daftar")}
${kpi("Kehadiran Hari Ini",'<span id="hem-attendance">—</span>','<span id="hem-attendance-foot">Memuatkan data...</span>',"◷","green","Sumber: HadirKelas")}
${kpi("Kes Disiplin Aktif",'<span id="hem-discipline">—</span>','<span id="hem-discipline-foot">Belum disambungkan</span><small id="hem-discipline-status" style="display:block;margin-top:5px;color:#8da5c3">Menunggu sambungan API</small>',"⚑","red","Modul disiplin belum disambungkan")}
${kpi("Kes UBK Aktif",'<span id="hem-ubk">—</span>','<span id="hem-ubk-foot">Memuatkan data UBK...</span>',"✚","purple","Sumber: Tab UBK")}
${kpi("Murid 3K / Sakit",'<span id="hem-sick">—</span>',"Hospital · MC · Rawatan · MC-PBM","✚","purple","Sumber: Kehadiran")}
</div>
<div class="grid charts">
<div class="card wide">${cardTitle("Analisis Kehadiran Mengikut Tingkatan","Peratus kehadiran harian berbanding garis sasaran 95%.","HARI INI")}<div class="chart-wrap"><canvas id="attendanceChart"></canvas></div></div>
<div class="card">${cardTitle("Agihan Kebajikan & Bantuan","Kemajuan agihan mengikut skim.","STATUS")}<div id="aidBars"></div></div>
<div class="card">${cardTitle("Disiplin & Sahsiah","Taburan rekod salah laku dan amalan baik.","TAHUN 2026")}<div class="donuts"><div class="donut-item"><div class="chart-wrap"><canvas id="disciplineChart"></canvas></div><b>Kes Salah Laku</b><small id="hemDisiplinJumlah">Menunggu data...</small></div><div class="donut-item"><div class="chart-wrap"><canvas id="goodChart"></canvas></div><b>Amalan Baik</b><small id="hemAmalanJumlah">Menunggu data...</small></div></div></div>
</div>
<div class="grid bottom">
<div class="card">${cardTitle("Makluman Keselamatan & Kesihatan","Pemantauan 3K dan tindakan berisiko.")}<div class="panel-list">
${row("red","Kes demam berkelompok","Blok B · 3 murid dipantau di bilik isolasi","08:40 pagi")}
${row("amber","Pemeriksaan perangkap nyamuk","Dapatan jentik-jentik di kawasan belakang kantin","Semalam")}
${row("green","Pemeriksaan alat pemadam api","Blok akademik selesai diperiksa","17 Nov")}
</div></div>
<div class="card">${cardTitle("Tugas / Tindakan Segera","Tandakan tugasan setelah selesai.","3 TUGAS")}<div class="panel-list">
${task("Semak penghantaran kehadiran APDM kelas 5","Guru tingkatan · Sebelum 10:00 pagi",false)}
${task("Pengesahan senarai penerima KWAMP","Penyelaras bantuan · 20 Nov 2026",false)}
${task("Kemas kini laporan kes SSDM","Setiausaha disiplin · 21 Nov 2026",true)}
${task("Semakan stok buku teks SPBT","Penyelaras SPBT · 24 Nov 2026",false)}
</div></div>
<div class="card last">${cardTitle("Pemberitahuan Aktiviti HEM","Jadual program dan aktiviti terdekat.")}<div class="panel-list">
${event("22 NOV","Program Ziarah Cakna","Lawatan keluarga murid 2 Cekal")}
${event("25 NOV","Latihan Kebakaran","Semua warga sekolah · 10:00 pagi")}
${event("28 NOV","Mesyuarat Jawatankuasa HEM","Bilik Mesyuarat Utama · 2:30 petang")}
</div></div></div>`}
function kpi(t,v,sub,ic,color,foot){return `<div class="card"><div class="kpi-top">${t}<span class="kpi-icon ${color}">${ic}</span></div><div class="kpi-value">${v}</div><div class="kpi-foot">${sub}</div><div class="kpi-foot" style="margin-top:9px">${foot}</div></div>`}
function row(c,t,d,time){return `<div class="list-row"><i class="dot" style="background:var(--${c})"></i><div style="flex:1"><b>${t}</b><small>${d}</small></div><span class="activity-time">${time}</span></div>`}
function task(t,d,done){return `<label class="task ${done?"done":""}"><input type="checkbox" ${done?"checked":""} onchange="this.parentElement.classList.toggle('done',this.checked)"><span><b>${t}</b><small>${d}</small></span></label>`}
function event(date,t,d){return `<div class="list-row"><div style="background:#1b385b;color:#8cbaff;border-radius:8px;padding:7px 6px;text-align:center;min-width:49px;font-size:9px;font-weight:800">${date}</div><div><b>${t}</b><small>${d}</small></div></div>`}

/* INTEGRASI DATA DISIPLIN & SAHSIAH DARIPADA GOOGLE SHEETS */
let hemSahsiahData = null;
let hemSahsiahLoading = false;
let hemSahsiahTimer = null;

function loadHemSahsiahData(){
  if(hemSahsiahLoading) return;
  hemSahsiahLoading = true;
  const cb = 'hemSahsiahCallback_' + Date.now();
  const script = document.createElement('script');
  let completed = false;

  const finish = () => {
    if(completed) return;
    completed = true;
    hemSahsiahLoading = false;
    if(hemSahsiahTimer) clearTimeout(hemSahsiahTimer);
    delete window[cb];
    script.remove();
  };

  window[cb] = data => {
    try {
      if(!data || !data.success) throw new Error(data && data.error ? data.error : 'API tidak memulangkan data success=true.');
      hemSahsiahData = data;
      updateHemSahsiahUI(data);
    } catch(err) {
      setHemSahsiahError('Ralat API Sahsiah: ' + err.message);
    } finally {
      finish();
    }
  };

  script.onerror = () => {
    setHemSahsiahError('Gagal menghubungi API hemSahsiah. Semak URL GAS dan deployment versi terkini.');
    finish();
  };

  hemSahsiahTimer = setTimeout(() => {
    setHemSahsiahError('API hemSahsiah tidak memberi respons. Kemungkinan kod GAS belum diterbitkan semula.');
    finish();
  }, 15000);

  script.src = GAS_URL + (GAS_URL.includes('?') ? '&' : '?') +
    'api=hemSahsiah&callback=' + encodeURIComponent(cb) + '&_=' + Date.now();
  document.body.appendChild(script);
}

function setHemSahsiahError(message){
  const active=document.getElementById('hem-discipline');
  const foot=document.getElementById('hem-discipline-foot');
  const status=document.getElementById('hem-discipline-status');
  if(active) active.textContent='—';
  if(foot) foot.textContent=message;
  if(status) status.textContent='Semakan: '+new Date().toLocaleTimeString('ms-MY');
  ['hemDisiplinJumlah','hemAmalanJumlah','hem-ubk-foot'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.textContent='Data belum diterima';
  });
}

function updateHemSahsiahUI(data){
  const disiplin=data.disiplin||{};
  const amalan=data.amalanBaik||{};
  const put=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value;};

  put('hem-discipline',fmt(Number(disiplin.aktif||0)));
  put('hem-discipline-foot',fmt(Number(disiplin.belumSelesai||0))+' kes belum selesai');
  put('hem-discipline-status','Dikemas kini: '+(data.dikemasKini||'—'));
  const ubk=data.ubk||{};
  put('hem-ubk',fmt(Number(ubk.aktif||0)));
  put('hem-ubk-foot',fmt(Number(ubk.belumSelesai||0))+' kes belum selesai · '+fmt(Number(ubk.jumlah||0))+' jumlah kes');
  put('hemDisiplinJumlah',fmt(Number(disiplin.jumlah||0))+' rekod direkodkan');
  put('hemAmalanJumlah',fmt(Number(amalan.jumlah||0))+' rekod direkodkan');

  ['disciplineChart','goodChart'].forEach(id=>{
    const old=charts.find(c=>c.canvas&&c.canvas.id===id);
    if(old){old.destroy();charts=charts.filter(c=>c!==old);}
  });

  const dRows=Array.isArray(disiplin.kategori)?disiplin.kategori:[];
  const aRows=Array.isArray(amalan.kategori)?amalan.kategori:[];
  const dColors=['#f16b75','#f5b942','#a78bfa','#4f8cff','#20c997','#37c6e8','#fb923c','#e879f9'];
  const aColors=['#20c997','#4f8cff','#f5b942','#a78bfa','#f16b75','#37c6e8','#fb923c','#e879f9'];

  donut('disciplineChart',
    dRows.length?dRows.map(x=>Number(x.jumlah||0)):[1],
    dRows.length?dRows.map(x=>x.nama):['Tiada rekod'],
    dRows.length?dRows.map((x,i)=>dColors[i%dColors.length]):['#40516b']);
  donut('goodChart',
    aRows.length?aRows.map(x=>Number(x.jumlah||0)):[1],
    aRows.length?aRows.map(x=>x.nama):['Tiada rekod'],
    aRows.length?aRows.map((x,i)=>aColors[i%aColors.length]):['#40516b']);
}


let monthlyAnalysisData = null;
function loadMonthlyAnalysis(monthValue){
  const note=document.getElementById('monthlyNote');

  const cb='hemMonthlyCallback_'+Date.now();

  window[cb]=d=>{
    try{
      if(!d || !d.success) throw new Error(d && d.error ? d.error : 'Respons API tidak sah.');
      monthlyAnalysisData=d;
      renderMonthlyAnalysis(d);
    }catch(err){if(note)note.textContent='Ralat: '+err.message;}
    finally{delete window[cb];script.remove();}
  };
  script.onerror=()=>{if(note)note.textContent='Gagal menghubungi GAS. Pastikan versi deployment terkini telah diterbitkan.';delete window[cb];script.remove();};
  script.src=GAS_URL+(GAS_URL.includes('?')?'&':'?')+'api=analisisBulanan&bulan='+
    encodeURIComponent(monthValue||'')+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();

}
function renderMonthlyAnalysis(d){
  const note=document.getElementById('monthlyNote');
  if(note)note.textContent=d.nota+' Kemas kini: '+d.dikemasKini;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  set('monthlyAvg',d.purata==null?'—':d.purata+'%');
  set('monthlyDays',fmt(d.hariDirekod));
  set('monthlyPresent',fmt(d.jumlahHadir));
  set('monthlyAbsent',fmt(d.jumlahTidakHadir));
  set('monthlyPeriod',d.bulanPaparan||d.bulan);
  set('monthlyClassCount',d.kelas.length+' kelas');
  const best=document.getElementById('monthlyBest');
  if(best)best.innerHTML=d.kelasTerbaik.length?d.kelasTerbaik.map((x,i)=>`<div class="list-row"><span class="tag">#${i+1}</span><div style="flex:1"><b>${escapeHtml(x.kelas)}</b><small>${fmt(x.hadir)} / ${fmt(x.jumlah)} hadir</small></div><span class="pill ok">${x.peratus}%</span></div>`).join(''):'<div class="empty-note">Tiada data</div>';
  const low=document.getElementById('monthlyAttention');
  if(low)low.innerHTML=d.perluPerhatian.length?d.perluPerhatian.map(x=>`<div class="list-row"><div style="flex:1"><b>${escapeHtml(x.kelas)}</b><small>${fmt(x.tidakHadir)} tidak hadir · ${x.hariDirekod} hari direkod</small></div><span class="pill warn">${x.peratus}%</span></div>`).join(''):'<div class="empty-note">Semua kelas mencapai sasaran atau tiada data.</div>';
  const tbody=document.getElementById('monthlyClassRows');
  if(tbody)tbody.innerHTML=d.kelas.length?d.kelas.map(x=>`<tr><td>${escapeHtml(x.kelas)}</td><td>${x.tingkatan||'—'}</td><td>${fmt(x.hariDirekod)}</td><td>${fmt(x.hadir)}</td><td>${fmt(x.tidakHadir)}</td><td><span class="pill ${x.peratus>=95?'ok':'warn'}">${x.peratus==null?'—':x.peratus+'%'}</span></td><td>${escapeHtml(x.status)}</td></tr>`).join(''):'<tr><td colspan="7" class="empty-note">Tiada data bagi bulan ini.</td></tr>';

  charts.forEach(c=>{if(c.canvas && (c.canvas.id==='monthlyTrendChart'||c.canvas.id==='monthlyLevelChart'))c.destroy();});
  charts=charts.filter(c=>c.canvas && c.canvas.id!=='monthlyTrendChart'&&c.canvas.id!=='monthlyLevelChart');
  const trendEl=document.getElementById('monthlyTrendChart');
  if(trendEl)charts.push(new Chart(trendEl,{type:'line',data:{labels:d.trend.map(x=>x.label),datasets:[{label:'Kehadiran',data:d.trend.map(x=>x.peratus),borderColor:'#4f8cff',backgroundColor:'#4f8cff22',fill:true,tension:.25,pointRadius:3},{label:'Sasaran 95%',data:d.trend.map(()=>95),borderColor:'#f16b75',borderDash:[6,5],pointRadius:0,borderWidth:2}]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9fb1c9',font:{size:9},usePointStyle:true}}},scales:{x:{ticks:{color:'#9fb1c9',maxRotation:0,autoSkip:true},grid:{display:false}},y:{min:0,max:100,ticks:{color:'#9fb1c9',callback:v=>v+'%'},grid:{color:'#26364d'}}}}}));
  const levelEl=document.getElementById('monthlyLevelChart');
  if(levelEl)charts.push(new Chart(levelEl,{type:'bar',data:{labels:d.tingkatan.map(x=>x.tingkatan.replace('Tingkatan ','T')),datasets:[{label:'Kehadiran',data:d.tingkatan.map(x=>x.peratus),backgroundColor:d.tingkatan.map(x=>x.peratus==null?'#52647d':x.peratus>=95?'#20c997':'#f5b942'),borderRadius:5},{type:'line',label:'Sasaran 95%',data:d.tingkatan.map(()=>95),borderColor:'#f16b75',borderDash:[6,5],pointRadius:0,borderWidth:2}]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9fb1c9',font:{size:9},usePointStyle:true}}},scales:{x:{ticks:{color:'#9fb1c9'},grid:{display:false}},y:{min:0,max:100,ticks:{color:'#9fb1c9',callback:v=>v+'%'},grid:{color:'#26364d'}}}}}));
}

    `<span class="tag">Kelas: ${d.bilKelas}</span> <span class="tag">Murid: ${fmt(d.jumlahMurid)}</span> <span class="tag">Hadir: ${fmt(d.hadir)}</span> <span class="tag">Tidak hadir: ${fmt(d.tidakHadir)}</span> <span class="tag">Kehadiran: ${d.peratus==null?'—':Math.round(d.peratus)+'%'}</span>`;

  if(body){
    body.innerHTML=d.rows.length?d.rows.map(r=>`<tr>

function statusPill(v){let s=String(v).toLowerCase(),c=(s.includes("selesai")||s==="aktif"||s==="baik"||s.includes("direkod"))?"ok":(s.includes("tindakan")||s.includes("siasatan")||s.includes("pemantauan"))?"warn":"info";return `<span class="pill ${c}">${v}</span>`}
function reports(){return `${head("Laporan & Analisis","Penjanaan laporan eksekutif untuk pemantauan dan mesyuarat pengurusan.")}<div class="grid report-grid">${[["Laporan Kehadiran","Analisis kehadiran mengikut tingkatan, kelas dan tempoh.","▣"],["Laporan Disiplin SSDM","Ringkasan salah laku, amalan baik dan status intervensi.","⚑"],["Laporan Kebajikan","Status agihan BAP, KWAMP, SPBT, RMT dan biasiswa.","♡"],["Laporan 3K","Kesihatan, keselamatan, kebersihan dan tindakan susulan.","✚"],["Laporan Kaunseling","Sesi kaunseling, psikometrik dan Ziarah Cakna.","☏"],["Laporan Eksekutif HEM","Ringkasan KPI utama untuk pembentangan pengurusan.","▤"]].map(x=>`<div class="card report-tile"><div class="kpi-icon blue" style="margin-bottom:13px">${x[2]}</div><h3>${x[0]}</h3><p>${x[1]}</p><button class="btn secondary" onclick="generateReport('${x[0]}','pdf')">Jana PDF ↗</button> <button class="btn secondary" onclick="generateReport('${x[0]}','excel')">Excel ↗</button></div>`).join("")}</div><div class="card section-card">${cardTitle("Prestasi KPI HEM","Pencapaian indikator utama sekolah bagi sesi 2026/2027.")}${[["Kehadiran murid","94.2% daripada sasaran 95%",94.2],["Penyelesaian agihan SPBT","98.4%",98.4],["Pengesahan BAP","96.6%",96.6],["Tindakan kes disiplin","75% kes selesai",75]].map(x=>`<div class="progress-row"><div class="progress-meta"><b>${x[0]}</b><span>${x[1]}</span></div><div class="progress"><i style="width:${x[2]}%"></i></div></div>`).join("")}</div>`}
function render(){charts.forEach(c=>c.destroy());charts=[];document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===currentPage));let c=document.getElementById("content");if(currentPage==="dashboard"){c.innerHTML=dashboard();setupCharts()}else if(currentPage==="murid"){c.innerHTML=profileModulePage()}else if(currentPage==="laporan")c.innerHTML=reports();else if(currentPage==="kehadiran"){if(currentSub==="Analisis Bulanan"){c.innerHTML=monthlyAnalysisPage();loadMonthlyAnalysis(document.getElementById("monthlyPicker").value)}else{c.innerHTML=attendancePage(currentSub);if((currentSub||submenus.kehadiran[0])==="Rekod Harian")loadAttendanceModule(document.getElementById("attendanceDate").value)}}else c.innerHTML=tablePage(currentPage,currentSub)}
function changeSub(p,s){currentSub=s;render()}
function filterTable(){let q=(document.getElementById("tableSearch")?.value||"").toLowerCase(),f=document.getElementById("filterSelect")?.value||"",rows=[...document.querySelectorAll("#dataTable tbody tr")],n=0;rows.forEach(r=>{let text=r.innerText.toLowerCase(),last=r.cells[r.cells.length-1].innerText;let show=text.includes(q)&&(!f||last===f);r.style.display=show?"":"none";if(show)n++});document.getElementById("rowCount").textContent=`Memaparkan ${n} daripada ${rows.length} rekod contoh`}
function generateReport(name,type){let text=`${name}\nSM Sains Sultan Mohamad Jiwa\nTarikh: 19 November 2026\n\nLaporan ini ialah simulasi prototaip Dashboard HEM.\nJumlah murid: 1,428\nKehadiran: 94.2%\nKes disiplin aktif: 12\nPenerima bantuan: 386\n`;let blob=new Blob([text],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name.replaceAll(" ","_")+(type==="pdf"?".txt (simulasi PDF).txt":".csv");a.click();URL.revokeObjectURL(a.href);alert(`Simulasi eksport ${type.toUpperCase()} dijalankan. Untuk fail PDF/Excel sebenar, sambungkan modul penjanaan dokumen.`)}
