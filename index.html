<script>
// URL Web App GAS Dashboard HEM. Isi URL deployment /exec yang sama digunakan oleh dashboard.
const HEM_GAS_API_URL = "https://script.google.com/macros/s/AKfycbzuufP2Vntuuq4y9k-PcunlBwyhpTLIG5E5GmAE2skwhhY-h6LrhHF7qIFrj681xwdV3w/exec";
let hemSahsiahData = null;
let hemSahsiahLoading = false;
const menuNames={dashboard:"Laman Utama",murid:"Profil & Data Murid",kehadiran:"Kehadiran & APDM",disiplin:"Disiplin & SSDM",bantuan:"Kebajikan & Bantuan",kaunseling:"Bimbingan & Kaunseling","3k":"Keselamatan, Kesihatan & Kebersihan (3K)",kantin:"Kantin & Asrama",pibg:"Pemuafakatan PIBG / Sarana",laporan:"Laporan & Analisis"};
const submenus={
murid:["Senarai Induk Murid","Pendaftaran & Pertukaran","Data Keciciran"],
kehadiran:["Rekod Harian","Analisis Bulanan","Ponteng Tegar","Status Penghantaran Kelas"],
disiplin:["Rekod Salah Laku","Rekod Amalan Baik","Kes Berat & Pengawas"],
bantuan:["BAP","KWAMP & Biasiswa","SPBT","RMT & Takaful"],
kaunseling:["Sesi Kaunseling","Ujian Psikometrik","Ziarah Cakna"],
"3k":["Kesihatan & Imunisasi","Denggi","Latihan Kecemasan","Bilik Isolasi"],
kantin:["Laporan Kendiri Kantin","Pemantauan Kualiti","Pengurusan Asrama"],
pibg:["Direktori AJK","Kehadiran Sarana","Kerjasama Agensi Luar"]
};
const students=[
["SM26001","Aiman Hakim bin Azman","1 Amanah","L","Aktif"],["SM26002","Nur Aisyah binti Rahman","1 Bestari","P","Aktif"],["SM25018","Muhammad Danish bin Zulkifli","2 Cekal","L","Aktif"],["SM25031","Siti Nur Balqis binti Ismail","2 Dinamik","P","Aktif"],["SM24009","Adam Firdaus bin Hassan","3 Amanah","L","Aktif"],["SM24042","Nur Izzati binti Omar","3 Bestari","P","Dalam pemantauan"],["SM23015","Harith Iman bin Rosli","4 Cekal","L","Aktif"],["SM23028","Nurul Huda binti Yusof","4 Dinamik","P","Aktif"],["SM22007","Amirul Syafiq bin Karim","5 Amanah","L","Aktif"],["SM22033","Puteri Balqis binti Azmi","5 Bestari","P","Aktif"],["SM26044","Danish Arif bin Saad","1 Cekal","L","Berpindah"],["SM24061","Nur Maisarah binti Ali","3 Dinamik","P","Aktif"]
];
let currentPage="dashboard",currentSub="",charts=[];
const fmt=n=>n.toLocaleString("ms-MY");
function head(title,desc){return `<div class="page-head"><div><div class="eyebrow">Pengurusan Hal Ehwal Murid</div><h1>${title}</h1><p>${desc}</p></div><div class="date-chip">◷ &nbsp; Khamis, 19 November 2026</div></div>`}
function cardTitle(t,s,tag=""){return `<div class="card-title"><div><h3>${t}</h3><p>${s}</p></div>${tag?`<span class="tag">${tag}</span>`:""}</div>`}
function dashboard(){return `${head("Ringkasan Eksekutif HEM","Pantauan menyeluruh status murid, kebajikan, disiplin dan keselamatan sekolah.")}<div class="grid kpis">
${kpi("Jumlah Murid","1,428","Lelaki 712 · Perempuan 716","♙","blue","+ 12 murid berbanding tahun lalu")}
${kpi("Kehadiran Hari Ini","94.2%","1,345 hadir · 83 tidak hadir","◷","green","- 0.8% daripada sasaran 95%")}
${`<div class="card"><div class="kpi-top">Kes Disiplin Aktif<span class="kpi-icon red">⚑</span></div><div class="kpi-value" id="hemDisiplinAktif">—</div><div class="kpi-foot" id="hemDisiplinAktifNota">Sedang memuatkan data Disiplin...</div><div class="kpi-foot" style="margin-top:9px" id="hemDisiplinAktifStatus">Sumber: tab Disiplin</div></div>`}
${kpi("Penerima Bantuan","386","BAP, KWAMP, biasiswa & RMT","♡","amber","27 permohonan dalam semakan")}
${kpi("Murid 3K / Sakit","8","5 sakit · 2 kesihatan · 1 keselamatan","✚","purple","2 tindakan susulan diperlukan")}
</div>
<div class="grid charts">
<div class="card wide">${cardTitle("Analisis Kehadiran Mengikut Tingkatan","Peratus kehadiran harian berbanding garis sasaran 95%.","HARI INI")}<div class="chart-wrap"><canvas id="attendanceChart"></canvas></div></div>
<div class="card">${cardTitle("Agihan Kebajikan & Bantuan","Kemajuan agihan mengikut skim.","STATUS")}<div id="aidBars"></div></div>
<div class="card">${cardTitle("Disiplin & Sahsiah","Taburan rekod salah laku dan amalan baik.","TAHUN 2026")}<div class="donuts"><div class="donut-item"><div class="chart-wrap"><canvas id="disciplineChart"></canvas></div><b>Kes Salah Laku</b><small id="hemDisiplinJumlah">Memuatkan rekod...</small></div><div class="donut-item"><div class="chart-wrap"><canvas id="goodChart"></canvas></div><b>Amalan Baik</b><small id="hemAmalanJumlah">Memuatkan rekod...</small></div></div></div>
</div>
<div class="grid bottom">
<div class="card">${cardTitle("Makluman Keselamatan & Kesihatan","Pemantauan 3K dan tindakan berisiko.")}<div class="panel-list">
${row("red","Kes demam berkelompok","Blok B · 3 murid dipantau di bilik isolasi","08:40 pagi")}
${row("amber","Pemeriksaan perangkap nyamuk","Dapatan jentik-jentik di kawasan belakang kantin","Semalam")}
${row("green","Pemeriksaan alat pemadam api","Blok akademik selesai diperiksa","17 Nov")}
</div></div>
<div class="card">${cardTitle("Tugas / Tindakan Segera","Tandakan tugasan setelah selesai.","3 TUGAS")}<div class="panel-list">
${task("Semak penghantaran kehadiran APDM kelas 5","Guru tingkatan · Sebelum 10:00 pagi",false)}
${task("Pengesahan senarai penerima KWAMP","Penyelaras bantuan · 20 Nov 2026",false)}
${task("Kemas kini laporan kes SSDM","Setiausaha disiplin · 21 Nov 2026",true)}
${task("Semakan stok buku teks SPBT","Penyelaras SPBT · 24 Nov 2026",false)}
</div></div>
<div class="card last">${cardTitle("Pemberitahuan Aktiviti HEM","Jadual program dan aktiviti terdekat.")}<div class="panel-list">
${event("22 NOV","Program Ziarah Cakna","Lawatan keluarga murid 2 Cekal")}
${event("25 NOV","Latihan Kebakaran","Semua warga sekolah · 10:00 pagi")}
${event("28 NOV","Mesyuarat Jawatankuasa HEM","Bilik Mesyuarat Utama · 2:30 petang")}
</div></div></div>`}
function kpi(t,v,sub,ic,color,foot){return `<div class="card"><div class="kpi-top">${t}<span class="kpi-icon ${color}">${ic}</span></div><div class="kpi-value">${v}</div><div class="kpi-foot">${sub}</div><div class="kpi-foot" style="margin-top:9px">${foot}</div></div>`}
function row(c,t,d,time){return `<div class="list-row"><i class="dot" style="background:var(--${c})"></i><div style="flex:1"><b>${t}</b><small>${d}</small></div><span class="activity-time">${time}</span></div>`}
function task(t,d,done){return `<label class="task ${done?"done":""}"><input type="checkbox" ${done?"checked":""} onchange="this.parentElement.classList.toggle('done',this.checked)"><span><b>${t}</b><small>${d}</small></span></label>`}
function event(date,t,d){return `<div class="list-row"><div style="background:#1b385b;color:#8cbaff;border-radius:8px;padding:7px 6px;text-align:center;min-width:49px;font-size:9px;font-weight:800">${date}</div><div><b>${t}</b><small>${d}</small></div></div>`}
function setupCharts(){
 charts.forEach(c=>c.destroy());charts=[];
 if(document.getElementById("attendanceChart")){charts.push(new Chart(document.getElementById("attendanceChart"),{type:"bar",data:{labels:["Tingkatan 1","Tingkatan 2","Tingkatan 3","Tingkatan 4","Tingkatan 5"],datasets:[{label:"Kehadiran",data:[96.1,94.8,92.7,95.4,92.2],backgroundColor:["#4f8cff","#4f8cff","#f5b942","#20c997","#f5b942"],borderRadius:5,barThickness:28},{type:"line",label:"Sasaran 95%",data:[95,95,95,95,95],borderColor:"#f16b75",borderDash:[6,5],pointRadius:0,borderWidth:2}]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:"#9fb1c9",font:{size:9},usePointStyle:true}}},scales:{x:{ticks:{color:"#9fb1c9",font:{size:9}},grid:{display:false}},y:{min:85,max:100,ticks:{color:"#9fb1c9",callback:v=>v+"%",font:{size:9}},grid:{color:"#26364d"}}}}}))}
 const aid=document.getElementById("aidBars");if(aid)aid.innerHTML=[["BAP","1,380 / 1,428 murid",96.6],["KWAMP","82 / 96 penerima",85.4],["SPBT","1,405 / 1,428 set",98.4],["Biasiswa","42 / 48 penerima",87.5]].map((x,i)=>`<div class="progress-row"><div class="progress-meta"><b>${x[0]}</b><span>${x[1]} · ${x[2]}%</span></div><div class="progress"><i style="width:${x[2]}%;background:${i===1?"#f5b942":i===3?"#a78bfa":"linear-gradient(90deg,#397ee8,#37c6e8)"}"></i></div></div>`).join("");
 const waitLabels=["Memuatkan data..."];
 donut("disciplineChart",[1],waitLabels,["#40516b"]);
 donut("goodChart",[1],waitLabels,["#40516b"]);
 loadHemSahsiahData();
}

function loadHemSahsiahData(){
 if(hemSahsiahLoading) return;
 if(!HEM_GAS_API_URL || HEM_GAS_API_URL.includes("PASTE_URL")){
   setHemSahsiahError("URL GAS belum ditetapkan.");
   return;
 }
 hemSahsiahLoading=true;
 const old=document.getElementById("hemSahsiahJsonp");
 if(old) old.remove();
 window.hemSahsiahCallback=function(res){
   hemSahsiahLoading=false;
   if(!res || !res.success){
     setHemSahsiahError(res && res.error ? res.error : "Respons API tidak sah.");
     return;
   }
   hemSahsiahData=res;
   updateHemSahsiahUI(res);
 };
 const script=document.createElement("script");
 script.id="hemSahsiahJsonp";
 script.src=HEM_GAS_API_URL + (HEM_GAS_API_URL.includes("?")?"&":"?") +
   "api=hemSahsiah&callback=hemSahsiahCallback&t="+Date.now();
 script.onerror=function(){
   hemSahsiahLoading=false;
   setHemSahsiahError("Tidak dapat menghubungi GAS. Semak URL dan deployment.");
 };
 document.head.appendChild(script);
}
function setHemSahsiahError(message){
 const ids=["hemDisiplinAktifNota","hemDisiplinAktifStatus","hemDisiplinJumlah","hemAmalanJumlah"];
 ids.forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=message;});
 const k=document.getElementById("hemDisiplinAktif");if(k)k.textContent="—";
}
function updateHemSahsiahUI(data){
 const active=document.getElementById("hemDisiplinAktif");
 const activeNote=document.getElementById("hemDisiplinAktifNota");
 const activeStatus=document.getElementById("hemDisiplinAktifStatus");
 const dTotal=document.getElementById("hemDisiplinJumlah");
 const aTotal=document.getElementById("hemAmalanJumlah");
 if(active)active.textContent=fmt(data.disiplin.aktif);
 if(activeNote)activeNote.textContent=fmt(data.disiplin.belumSelesai)+" kes belum selesai";
 if(activeStatus)activeStatus.textContent="Dikemas kini: "+(data.dikemasKini||"—");
 if(dTotal)dTotal.textContent=fmt(data.disiplin.jumlah)+" rekod direkodkan";
 if(aTotal)aTotal.textContent=fmt(data.amalanBaik.jumlah)+" rekod direkodkan";
 charts.filter(c=>c.canvas && ["disciplineChart","goodChart"].includes(c.canvas.id)).forEach(c=>c.destroy());
 charts=charts.filter(c=>!(c.canvas && ["disciplineChart","goodChart"].includes(c.canvas.id)));
 donut("disciplineChart",
   data.disiplin.kategori.map(x=>x.jumlah),
   data.disiplin.kategori.map(x=>x.nama),
   ["#f16b75","#f5b942","#a78bfa","#4f8cff","#20c997","#37c6e8","#fb923c","#e879f9"]);
 donut("goodChart",
   data.amalanBaik.kategori.map(x=>x.jumlah),
   data.amalanBaik.kategori.map(x=>x.nama),
   ["#20c997","#4f8cff","#f5b942","#a78bfa","#f16b75","#37c6e8","#fb923c","#e879f9"]);
}

function donut(id,data,labels,colors){let el=document.getElementById(id);if(el)charts.push(new Chart(el,{type:"doughnut",data:{labels,datasets:[{data,backgroundColor:colors,borderColor:"#142137",borderWidth:3,hoverOffset:4}]},options:{maintainAspectRatio:false,cutout:"68%",plugins:{legend:{display:false},tooltip:{enabled:true}}}}))}
function tablePage(page,sub){
 const cfg={
 murid:{title:"Profil & Data Murid",desc:"Direktori induk, status pendaftaran dan pemantauan keciciran.",subs:submenus.murid,headers:["No. ID","Nama Murid","Kelas","Jantina","Status"],rows:students},
 kehadiran:{title:"Kehadiran & APDM",desc:"Pemantauan rekod harian, analisis bulanan dan intervensi ponteng.",subs:submenus.kehadiran,headers:["Kelas","Jumlah Murid","Hadir","Tidak Hadir","Kehadiran"],rows:[["1 Amanah","30","29","1","96.7%"],["2 Cekal","29","27","2","93.1%"],["3 Bestari","31","28","3","90.3%"],["4 Dinamik","28","27","1","96.4%"],["5 Amanah","30","27","3","90.0%"],["5 Bestari","29","28","1","96.6%"]]},
 disiplin:{title:"Disiplin & SSDM",desc:"Pengurusan salah laku, amalan baik, kes berat dan pengawas.",subs:submenus.disiplin,headers:["Tarikh","Nama Murid","Kelas","Kategori","Status"],rows:[["19/11/2026","Murid SM24042","3 Bestari","Ponteng kelas","Dalam tindakan"],["18/11/2026","Murid SM23015","4 Cekal","Lewat hadir","Selesai"],["17/11/2026","Murid SM25018","2 Cekal","Merokok / vape","Siasatan"],["16/11/2026","Murid SM26001","1 Amanah","Amalan baik","Direkodkan"]]},
 bantuan:{title:"Kebajikan & Bantuan",desc:"Penyelarasan bantuan persekolahan, kebajikan dan perlindungan murid.",subs:submenus.bantuan,headers:["Program","Sasaran","Telah diagih","Dalam proses","Kemajuan"],rows:[["BAP","1,428","1,380","48","96.6%"],["KWAMP","96","82","14","85.4%"],["Biasiswa","48","42","6","87.5%"],["SPBT","1,428","1,405","23","98.4%"],["RMT","120","120","0","100%"],["Takaful","1,428","1,428","0","100%"]]},
 kaunseling:{title:"Bimbingan & Kaunseling",desc:"Rekod sesi, saringan psikometrik dan intervensi Ziarah Cakna.",subs:submenus.kaunseling,headers:["Tarikh","Aktiviti","Kumpulan","Pegawai","Status"],rows:[["19/11/2026","Sesi individu","Tingkatan 3","Guru B&K","Selesai"],["20/11/2026","Saringan psikometrik","Tingkatan 1","Guru B&K","Dijadualkan"],["22/11/2026","Ziarah Cakna","Keluarga murid 2 Cekal","Pasukan HEM","Dirancang"]]},
 "3k":{title:"Keselamatan, Kesihatan & Kebersihan (3K)",desc:"Pemantauan kesihatan, keselamatan persekitaran dan kebersihan.",subs:submenus["3k"],headers:["Tarikh","Komponen","Lokasi","Dapatan","Status"],rows:[["19/11/2026","Kesihatan","Bilik Isolasi","5 murid dipantau","Dalam pemantauan"],["18/11/2026","Denggi","Blok B","1 lokasi berisiko","Tindakan"],["17/11/2026","Keselamatan","Blok Akademik","Pemeriksaan alat pemadam api","Selesai"]]},
 kantin:{title:"Kantin & Asrama",desc:"Pemantauan kendiri kantin, kualiti makanan dan pengurusan asrama.",subs:submenus.kantin,headers:["Tarikh","Komponen","Penyelia","Skor / Dapatan","Status"],rows:[["19/11/2026","Kebersihan kantin","Penyelia Kantin","92 / 100","Baik"],["18/11/2026","Kualiti makanan","Jawatankuasa Kantin","Menu mematuhi","Selesai"],["17/11/2026","Asrama","Warden bertugas","2 aduan penyelenggaraan","Tindakan"]]},
 pibg:{title:"Pemuafakatan PIBG / Sarana",desc:"Jaringan ibu bapa, komuniti dan agensi luar untuk menyokong murid.",subs:submenus.pibg,headers:["Nama / Organisasi","Peranan","Telefon","Penglibatan","Status"],rows:[["Yang Dipertua PIBG","Penasihat","04-000 0000","Mesyuarat PIBG","Aktif"],["Pejabat Pendidikan Daerah","Agensi pendidikan","04-000 0001","Bimbingan akademik","Aktif"],["Klinik Kesihatan","Agensi kesihatan","04-000 0002","Program kesihatan","Aktif"]]}
 }[page];
 let chosen=sub||cfg.subs[0];
 let rows=cfg.rows;
 let isStudent=page==="murid";
 return `${head(cfg.title,cfg.desc)}<div class="subnav">${cfg.subs.map(s=>`<button class="${s===chosen?"active":""}" onclick="changeSub('${page}','${s}')">${s}</button>`).join("")}</div><div class="notice">Paparan prototaip · Modul <b>${chosen}</b>. Data contoh dipaparkan untuk demonstrasi aliran kerja dan bukan rekod rasmi APDM / SSDM.</div><div class="card">${cardTitle(chosen,isStudent?"Senarai contoh murid berdaftar":"Ringkasan rekod dan status terkini","DATA CONTOH")}<div class="toolbar"><input class="field" id="tableSearch" placeholder="Cari nama, kelas atau rekod..." oninput="filterTable()"><select class="field" id="filterSelect" onchange="filterTable()"><option value="">Semua rekod</option>${(isStudent?["Aktif","Dalam pemantauan","Berpindah"]:["Selesai","Dalam tindakan","Siasatan","Aktif"]).map(x=>`<option>${x}</option>`).join("")}</select><button class="btn secondary" onclick="alert('Fungsi tambah rekod ialah simulasi prototaip.')">＋ Tambah rekod</button><button class="btn secondary" onclick="alert('Data contoh sedia untuk dieksport dalam versi integrasi.')">⇩ Eksport</button></div><div class="table-wrap"><table id="dataTable"><thead><tr>${cfg.headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td>${i===r.length-1?statusPill(v):v}</td>`).join("")}</tr>`).join("")}</tbody></table></div><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-top:12px"><span id="rowCount">Memaparkan ${rows.length} rekod contoh</span><span>Halaman 1 daripada 1</span></div></div>`;
}
function statusPill(v){let s=String(v).toLowerCase(),c=(s.includes("selesai")||s==="aktif"||s==="baik"||s.includes("direkod"))?"ok":(s.includes("tindakan")||s.includes("siasatan")||s.includes("pemantauan"))?"warn":"info";return `<span class="pill ${c}">${v}</span>`}
function reports(){return `${head("Laporan & Analisis","Penjanaan laporan eksekutif untuk pemantauan dan mesyuarat pengurusan.")}<div class="grid report-grid">${[["Laporan Kehadiran","Analisis kehadiran mengikut tingkatan, kelas dan tempoh.","▣"],["Laporan Disiplin SSDM","Ringkasan salah laku, amalan baik dan status intervensi.","⚑"],["Laporan Kebajikan","Status agihan BAP, KWAMP, SPBT, RMT dan biasiswa.","♡"],["Laporan 3K","Kesihatan, keselamatan, kebersihan dan tindakan susulan.","✚"],["Laporan Kaunseling","Sesi kaunseling, psikometrik dan Ziarah Cakna.","☏"],["Laporan Eksekutif HEM","Ringkasan KPI utama untuk pembentangan pengurusan.","▤"]].map(x=>`<div class="card report-tile"><div class="kpi-icon blue" style="margin-bottom:13px">${x[2]}</div><h3>${x[0]}</h3><p>${x[1]}</p><button class="btn secondary" onclick="generateReport('${x[0]}','pdf')">Jana PDF ↗</button> <button class="btn secondary" onclick="generateReport('${x[0]}','excel')">Excel ↗</button></div>`).join("")}</div><div class="card section-card">${cardTitle("Prestasi KPI HEM","Pencapaian indikator utama sekolah bagi sesi 2026/2027.")}${[["Kehadiran murid","94.2% daripada sasaran 95%",94.2],["Penyelesaian agihan SPBT","98.4%",98.4],["Pengesahan BAP","96.6%",96.6],["Tindakan kes disiplin","75% kes selesai",75]].map(x=>`<div class="progress-row"><div class="progress-meta"><b>${x[0]}</b><span>${x[1]}</span></div><div class="progress"><i style="width:${x[2]}%"></i></div></div>`).join("")}</div>`}
function render(){charts.forEach(c=>c.destroy());charts=[];document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===currentPage));let c=document.getElementById("content");if(currentPage==="dashboard"){c.innerHTML=dashboard();setupCharts()}else if(currentPage==="laporan")c.innerHTML=reports();else c.innerHTML=tablePage(currentPage,currentSub)}
function changeSub(p,s){currentSub=s;render()}
function filterTable(){let q=(document.getElementById("tableSearch")?.value||"").toLowerCase(),f=document.getElementById("filterSelect")?.value||"",rows=[...document.querySelectorAll("#dataTable tbody tr")],n=0;rows.forEach(r=>{let text=r.innerText.toLowerCase(),last=r.cells[r.cells.length-1].innerText;let show=text.includes(q)&&(!f||last===f);r.style.display=show?"":"none";if(show)n++});document.getElementById("rowCount").textContent=`Memaparkan ${n} daripada ${rows.length} rekod contoh`}
function generateReport(name,type){let text=`${name}\nSM Sains Sultan Mohamad Jiwa\nTarikh: 19 November 2026\n\nLaporan ini ialah simulasi prototaip Dashboard HEM.\nJumlah murid: 1,428\nKehadiran: 94.2%\nKes disiplin aktif: 12\nPenerima bantuan: 386\n`;let blob=new Blob([text],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name.replaceAll(" ","_")+(type==="pdf"?".txt (simulasi PDF).txt":".csv");a.click();URL.revokeObjectURL(a.href);alert(`Simulasi eksport ${type.toUpperCase()} dijalankan. Untuk fail PDF/Excel sebenar, sambungkan modul penjanaan dokumen.`)}
document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>{currentPage=b.dataset.page;currentSub="";render();document.getElementById("sidebar").classList.remove("open")}));
document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){currentPage="murid";currentSub="Senarai Induk Murid";render();let x=document.getElementById("tableSearch");if(x){x.value=e.target.value;filterTable()}}});
render();
</script>
